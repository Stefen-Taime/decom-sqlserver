name: decom-cloudbeaver
services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:26.2.3@sha256:0c875296f85ffd7c0ffaaaeff678cd2f383890050297585318d7cf8f49024d1f
    user: "8978:8978"
    entrypoint: ["/bin/bash", "/opt/lab/start.sh"]
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.0
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:8978:8978"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx768m -XX:ActiveProcessorCount=2"
      CB_SERVER_NAME: "SQL Server Migration Lab"
      CB_SERVER_URL: "http://localhost:8978/"
      CB_ADMIN_NAME: stefen
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "false"
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "false"
      CLOUDBEAVER_RESOURCE_QUOTA_SQL_MAX_RUNNING_QUERIES: "3"
      CLOUDBEAVER_RESOURCE_QUOTA_SQL_RESULT_SET_ROWS_LIMIT: "10000"
    secrets: [admin_password]
    volumes:
      - ${CLOUDBEAVER_DATA_DIR:-./data}:/opt/cloudbeaver/workspace
      - ./start.sh:/opt/lab/start.sh:ro
    networks: [source, warehouse]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8978; printf \"GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \"200\"'"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  admin_password:
    file: ${CLOUDBEAVER_SECRET_DIR:-./.secrets}/admin_password
networks:
  source:
    external: true
    name: decom-sqlserver-backend
  warehouse:
    external: true
    name: decom-warehouse-backend
