name: decom-warehouse
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    user: "999:999"
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust --data-checksums"
      PGDATA: /var/lib/postgresql/18/docker
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=8MB", "-c", "maintenance_work_mem=64MB", "-c", "effective_cache_size=1GB", "-c", "max_connections=30", "-c", "timezone=UTC", "-c", "log_min_duration_statement=1000", "-c", "log_parameter_max_length_on_error=0"]
    secrets: [admin_password]
    volumes:
      - ${WAREHOUSE_DATA_DIR:-./data}/postgres:/var/lib/postgresql
    networks: [warehouse]
    ports: ["127.0.0.1:5432:5432"]
    mem_limit: 1280m
    memswap_limit: 1280m
    shm_size: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warehouse_admin", "-d", "warehouse"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    logging: &logging
      driver: local
      options: {max-size: "10m", max-file: "3"}
  loader:
    build:
      context: ..
      dockerfile: warehouse/loader/Dockerfile
    image: decom-warehouse-loader:3
    user: "10004:10004"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    environment:
      PGHOST: postgres
      PGDATABASE: warehouse
      PGUSER: warehouse_loader
      PGPASSWORD_FILE: /run/secrets/loader_password
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: cdc-raw
      ARCHIVE_PREFIX: raw/wwi/bootstrap-v2
      SNAPSHOT_COMMIT_LSN: "00000274:00000758:0003"
      S3_CREDENTIALS_FILE: /run/secrets/archive_reader
    secrets: [loader_password, archive_reader]
    networks: [warehouse, archive]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "python", "load.py", "--health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 300s
    logging: *logging
  backfill:
    extends: {service: loader}
    profiles: [tools]
    restart: "no"
    command: ["python", "load.py"]
    cpus: 1.5
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck: {disable: true}
secrets:
  admin_password:
    file: ${WAREHOUSE_SECRET_DIR:-./.secrets}/admin_password
  loader_password:
    file: ${WAREHOUSE_SECRET_DIR:-./.secrets}/loader_password
  archive_reader:
    file: ${WAREHOUSE_SECRET_DIR:-./.secrets}/s3-reader.json
networks:
  warehouse:
    external: true
    name: decom-warehouse-backend
  archive:
    external: true
    name: decom-cdc-archive
