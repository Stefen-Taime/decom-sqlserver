debezium.source.connector.class=io.debezium.connector.sqlserver.SqlServerConnector
debezium.source.database.hostname=sqlserver
debezium.source.database.port=1433
debezium.source.database.names=WideWorldImporters
debezium.source.database.user=debezium_cdc
debezium.source.database.password=${DEBEZIUM_DB_PASSWORD}
debezium.source.database.encrypt=true
debezium.source.database.trustServerCertificate=true
debezium.source.topic.prefix=wwi
debezium.source.table.include.list=Sales.Customers,Sales.Orders,Sales.OrderLines,Sales.Invoices,Sales.InvoiceLines,lab.CdcProbe
debezium.source.snapshot.mode=initial
debezium.source.snapshot.fetch.size=1000
debezium.source.max.batch.size=200
debezium.source.max.queue.size=2048
debezium.source.poll.interval.ms=1000
debezium.source.decimal.handling.mode=string
# WWI temporal-table ValidTo reaches year 9999; epoch nanoseconds overflow int64.
# ISO strings preserve SQL Server's seven fractional digits without that overflow.
debezium.source.time.precision.mode=isostring
debezium.source.include.schema.changes=false
debezium.source.tombstones.on.delete=false
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat
debezium.source.schema.history.internal.store.only.captured.tables.ddl=true

debezium.format.value=json
debezium.format.value.schemas.enable=true
debezium.sink.type=http
debezium.sink.http.url=http://archiver:8080/events
debezium.sink.http.batch.enabled=true
debezium.sink.http.batch.max-size=200
debezium.sink.http.timeout.ms=60000
debezium.sink.http.retries=60
debezium.sink.http.retry.interval.ms=2000
debezium.sink.http.authentication.type=standard-webhooks
debezium.sink.http.authentication.webhook.secret=${ARCHIVE_WEBHOOK_SECRET}

record.processing.threads=1
record.processing.order=ORDERED
record.processing.shutdown.timeout.ms=30000
quarkus.http.host=0.0.0.0
quarkus.log.console.json=false
quarkus.log.level=INFO
